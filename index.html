<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presupuesto — Taller El Semáforo</title>
<link rel="icon" href="logo.png">

<!-- Icono y nombre al agregarla a la pantalla de inicio del celular.
     iOS no aplica transparencia ni redondea: el icono ya viene cuadrado y con fondo.

     A propósito NO se declara apple-mobile-web-app-capable. Con eso, en iPhone la
     herramienta abriría sin la barra de Safari — más lindo, pero ahí desaparece el
     botón de compartir, que es por donde se imprime. Imprimir es lo que esta
     herramienta hace: vale más eso que sacar una barra. En Android el manifest sí
     la abre en ventana propia, porque Chrome conserva Imprimir en su menú. -->
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-title" content="Presupuestos">
<meta name="theme-color" content="#15181c">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --tinta:#15181c;
    --tenue:#5b636d;
    --linea:#b9c0c8;
    --linea-suave:#dfe3e8;
    --papel:#fff;
    --fondo:#eceff3;
    --naranja:#F07E26;
    --verde:#23B14C;
    --rojo:#E1224B;

    /* medidas de pantalla; en escritorio se agrandan más abajo */
    --hoja-ancho:740px;
    --txt-base:14px;
    --txt-campo:13.5px;
    --txt-razon:21px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--fondo);
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--tinta);
    font-size:var(--txt-base);
    padding:14px 10px 96px;
  }
  input{font-family:inherit;color:inherit}

  .hoja{
    max-width:var(--hoja-ancho);margin:0 auto;background:var(--papel);
    border:1px solid #d3d8de;box-shadow:0 2px 14px rgba(20,20,20,.09);
    padding:18px;position:relative;display:flex;flex-direction:column;
  }

  /* ---------- marca de agua ----------
     Disuasivo visual: no impide falsificar —nada impreso lo impide— pero delata
     la edición casual del PDF y se degrada mal en la fotocopia. Verificar de
     verdad un papel es buscar su número en el historial y comparar el monto. */
  .marca{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
    display:flex;align-items:center;justify-content:center;
  }
  .marca span{
    width:170%;transform:rotate(-27deg);text-align:center;word-break:break-all;
    font-size:12px;font-weight:800;letter-spacing:2.5px;line-height:3.1;
    color:rgba(21,24,28,.05);
  }
  /* el contenido va por encima de la marca */
  .cab,.datos,.caja,.tot,.add{position:relative;z-index:1}

  /* ---------- cabecera ---------- */
  .cab{display:flex;gap:12px;align-items:flex-start;border-bottom:2px solid var(--tinta);padding-bottom:8px}
  .cab img{height:58px;width:auto;flex:none}
  .cab-txt{flex:1;min-width:0}
  .razon{font-size:var(--txt-razon);font-weight:800;letter-spacing:-.5px;line-height:1;margin:0 0 3px}
  .sub{font-size:10px;line-height:1.5;color:var(--tenue)}
  .cab-der{flex:none;text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .tipo{font-size:13px;font-weight:800;letter-spacing:2.6px;color:var(--tenue)}
  .nro{border:1.5px solid var(--tinta);padding:2px 10px;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  /* Aviso chico DEBAJO del casillero, no adentro: el texto largo deformaría la
     caja y en el celular rompería la cabecera. */
  .nro-aviso{font-size:9px;color:var(--tenue);font-weight:700;letter-spacing:.3px;margin-top:-2px}
  .f-caja{border:1px solid var(--linea);padding:2px 6px}
  .f-caja input{border:0;background:transparent;font-size:12px;font-weight:600;text-align:center;width:106px;padding:1px 0}
  .f-caja input:focus{outline:0}
  #fecha-txt{display:none;font-size:12px;font-weight:600}

  /* enlaces del encabezado: deben verse igual que el texto plano */
  .contacto{color:inherit;text-decoration:none;display:inline-block;padding:3px 0}

  /* ---------- datos del cliente ---------- */
  .datos{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:8px 0 2px}
  .campo{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--linea-suave);padding:3px 0 1px}
  .campo.ancho{grid-column:1 / -1}
  .campo label{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--tenue);flex:none;font-weight:700}
  .campo input{flex:1;min-width:0;border:0;background:transparent;font-size:var(--txt-campo);padding:1px 2px 2px}
  .campo input:focus{outline:0;background:#fff8e6}

  /* ---------- conceptos ----------
     El recuadro lo dibuja .caja y no la tabla, para poder estirarlo hasta el pie
     de la hoja sin tocar el alto de los renglones. Ningún renglón se deforma:
     lo que crece es el marco, como en el talonario de papel. */
  .caja{border:1.5px solid var(--tinta);margin-top:10px;display:flex;flex-direction:column}
  table{width:100%;border-collapse:collapse}
  thead th{
    font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--tenue);font-weight:700;
    text-align:left;padding:4px 8px;border-bottom:1.5px solid var(--tinta);background:#f7f8fa;
  }
  th.c-imp{width:140px;text-align:right}
  th.c-x{width:32px}
  tbody td{border-bottom:1px solid var(--linea-suave);padding:0}
  tbody input,tfoot input{width:100%;border:0;background:transparent;font-size:var(--txt-campo);padding:8px}
  tbody input:focus,tfoot input:focus{outline:0;background:#fff8e6}
  td.imp input{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  tfoot .r-mo td{border-top:1.5px solid var(--tinta);border-bottom:0}
  tfoot .r-mo span{display:block;padding:8px;font-size:var(--txt-campo);font-weight:700}
  tfoot .r-mo input{font-weight:700}
  .quitar{width:100%;border:0;background:transparent;color:#c3c9d0;font-size:18px;line-height:1;padding:7px 0;cursor:pointer}
  .quitar:hover{color:var(--rojo)}
  .add{
    margin:8px;background:transparent;border:1px dashed var(--linea);
    color:var(--tenue);font:inherit;font-size:12.5px;font-weight:600;padding:9px;cursor:pointer;
  }
  .add:hover{border-color:var(--naranja);color:var(--naranja)}

  /* ---------- total ---------- */
  .tot{margin:10px 0 0 auto;width:100%;max-width:322px}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:14px;
        border-top:1.5px solid var(--tinta);border-bottom:4px double var(--tinta);padding:9px 0;font-size:19px}
  .fila span{letter-spacing:.6px;text-transform:uppercase;font-size:12px;font-weight:700}
  .fila b{font-variant-numeric:tabular-nums;font-weight:700}
  .letras{margin-top:9px;font-size:11px;color:var(--tenue);text-align:right}
  .letras span{color:var(--tinta)}

  /* ---------- menú de acciones ---------- */
  .acciones{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d3d8de;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    max-width:760px;margin:0 auto;box-shadow:0 -2px 14px rgba(20,20,20,.09);z-index:40;
  }
  .disparador{
    width:100%;border:0;background:var(--tinta);color:#fff;font:inherit;font-size:15px;
    font-weight:700;padding:14px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;
  }
  .disparador .flecha{font-size:11px;transition:transform .18s}
  .acciones.abierto .disparador .flecha{transform:rotate(180deg)}
  .menu{display:none;border:1px solid #d3d8de;border-bottom:0;background:#fff}
  .acciones.abierto .menu{display:block}
  .menu button{
    width:100%;border:0;border-bottom:1px solid var(--linea-suave);background:transparent;
    font:inherit;font-size:15px;text-align:left;padding:15px 16px;cursor:pointer;color:var(--tinta);
  }
  .menu button:hover{background:#f7f8fa}
  .menu button.principal{font-weight:700;color:var(--verde)}
  .menu button.inerte{color:var(--tenue);cursor:progress}
  .menu button.salir{color:var(--rojo)}

  /* ---------- historial ---------- */
  .modal{position:fixed;inset:0;background:rgba(20,20,20,.5);display:none;z-index:60;padding:14px}
  .modal.abierto{display:flex;align-items:flex-end;justify-content:center}
  .panel{background:#fff;width:100%;max-width:600px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .p-cab{padding:13px 16px;border-bottom:1px solid var(--linea-suave);display:flex;justify-content:space-between;align-items:center}
  .p-cab h2{margin:0;font-size:15px}
  .p-cab button{border:0;background:transparent;font-size:21px;color:var(--linea);cursor:pointer;line-height:1}
  .lista{overflow-y:auto}
  .item{padding:12px 16px;border-bottom:1px solid #f2f4f6;display:flex;justify-content:space-between;
        align-items:center;gap:10px;cursor:pointer}
  .item:hover{background:#f7f8fa}
  .i-datos{flex:1;min-width:0}
  .i-n{font-weight:700;font-size:14px}
  .i-d{font-size:12px;color:var(--tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .i-m{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
  .vacio{padding:28px 16px;text-align:center;color:var(--tenue);font-size:13px}

  /* ---------- modales chicos: login, carga ---------- */
  .modal.centrado.abierto{align-items:center}
  .p-cuerpo{padding:16px;overflow-y:auto}
  .p-cuerpo label{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;
                  color:var(--tenue);font-weight:700;margin-bottom:5px}
  .entrada{
    width:100%;border:1px solid var(--linea);background:transparent;font:inherit;
    font-size:15px;padding:9px;margin-bottom:14px;
  }
  .entrada:focus{outline:0;border-color:var(--naranja);background:#fff8e6}
  .c-error{margin:-4px 0 14px;font-size:12.5px;color:var(--rojo);font-weight:600}
  .c-botones{display:flex;gap:9px;margin-top:2px}
  .c-botones button{
    flex:1;border:1px solid var(--linea);background:#fff;font:inherit;font-size:14px;
    padding:11px;cursor:pointer;color:var(--tinta);
  }
  .c-botones button.principal{background:var(--tinta);border-color:var(--tinta);color:#fff;font-weight:700}
  .c-botones button:disabled{opacity:.55;cursor:progress}
  .carga{padding:36px 16px;text-align:center;color:var(--tenue);font-size:14px}
  [hidden]{display:none!important}

  /* ---------- avisos ---------- */
  .aviso{
    position:fixed;left:50%;transform:translateX(-50%);bottom:82px;background:var(--tinta);color:#fff;
    padding:10px 18px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;
    max-width:88vw;text-align:center;
  }
  .aviso.ver{opacity:1}

  /* ---------- escritorio: todo más grande ---------- */
  @media (min-width:1000px){
    :root{--hoja-ancho:940px;--txt-base:16px;--txt-campo:16px;--txt-razon:27px}
    body{padding:26px 20px 110px}
    .hoja{padding:30px 32px}
    .cab img{height:78px}
    .sub{font-size:12.5px}
    .nro{font-size:20px;padding:3px 13px}
    .tipo{font-size:15px}
    .f-caja input{font-size:14px;width:124px}
    .campo{padding:6px 0 3px}
    .campo label{font-size:11.5px}
    .datos{gap:0 34px;padding:14px 0 4px}
    thead th{font-size:11px;padding:7px 11px}
    tbody input,tfoot input,tfoot .r-mo span{padding:11px}
    .caja{margin-top:16px;flex:1}
    .hoja{min-height:calc(var(--hoja-ancho) * 1.25)}
    .add{font-size:14px;padding:12px}
    .tot{max-width:400px;margin-top:16px}
    .fila{font-size:25px;padding:12px 0}
    .fila span{font-size:14px}
    .letras{font-size:13px}
    .acciones{padding:12px 14px}
    .disparador{font-size:16px;padding:15px}
    .menu button{font-size:16px;padding:16px 18px}
  }
  @media (max-width:520px){ .datos{grid-template-columns:1fr} }

  /* ---------- impresión ---------- */
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff;padding:0;font-size:15.5px}
    .hoja{max-width:none;border:0;box-shadow:none;padding:0;min-height:246mm}
    .caja{margin-top:11px;flex:1}
    .acciones,.add,.modal,.aviso,.quitar,th.c-x{display:none!important}
    .marca span{color:rgba(21,24,28,.055);font-size:15px}
    .marca{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    td.x{display:none}
    tr.vacia{display:none!important}
    input{background:transparent!important}

    /* los enlaces siguen siendo clickeables pero NUNCA muestran la URL */
    a[href]:after,a[href]:before{content:none!important}
    .contacto{color:inherit!important;text-decoration:none!important;padding:0}

    .cab{padding-bottom:6px}
    .cab img{height:60px}
    .razon{font-size:22px}
    .sub{font-size:11px;line-height:1.4}
    .nro{font-size:19.5px;padding:3px 10px}
    .nro-aviso{display:none}
    .tipo{font-size:15px}
    .datos{padding:8px 0 1px}
    .campo{padding:3px 0 0;border-bottom:1px solid #666}
    .campo label{font-size:13px}
    .campo input{font-size:15px}
    #fecha{display:none}
    #fecha-txt{display:inline-block;width:106px;text-align:center}
    thead th{font-size:12.5px}
    thead th{padding:5px 10px}
    tbody input,tfoot input,tfoot .r-mo span{padding:7px 13px;font-size:15px}
    td.imp input{padding-right:10px}
    .tot{margin-top:10px;max-width:420px}
    .fila{font-size:25px;padding:11px 0}
    .fila span{font-size:15.5px}
    .letras{font-size:14px}

    /* si hay segunda hoja, que salga bien */
    thead{display:table-header-group}
    tfoot{display:table-row-group}
    tr{break-inside:avoid;page-break-inside:avoid}
    .tot,.cab{break-inside:avoid;page-break-inside:avoid}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="modal centrado abierto" id="carga">
  <div class="panel" style="max-width:300px">
    <div class="carga" id="carga-txt">Conectando…</div>
  </div>
</div>

<div class="hoja">

<nav class="acciones" id="acciones">

<script>
"use strict";

/* ===================== configuración ===================== */
const SUPABASE_URL = 'https://osslhkvdclrbukjqwpnt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MV1IZ770uuRM2bUmZqmuWA_mdicKzXw';
const CLAVE_SESION = 'semaforo-sesion';
const CAMPOS = ['fecha','cliente','direccion','vehiculo','patente','telefono'];
const MAX_HISTORIAL = 200;

/* Columnas del CSV de respaldo, en orden. TEXTO marca cuáles se escapan como texto:
   una celda de texto que arranque con = + - @ la toma Excel como fórmula. */
const COLUMNAS = ['numero_presupuesto','fecha_consulta','nombre_cliente','direccion','telefono',
                  'vehiculo','patente','detalle','importe',
                  'subtotal_repuestos','monto_mano_obra','monto_total','creado_en','modificado_en'];
const TEXTO = [false,true,true,true,true,true,true,true,false,false,false,false,true,true];

const $ = id => document.getElementById(id);

/* ===================== números ===================== */
const aNumero  = v => {
  const n = parseFloat(String(v ?? '').replace(/[^\d,-]/g, '').replace(',', '.'));
  return isNaN(n) ? 0 : n;
};
const conMiles  = n => n ? Math.round(n).toLocaleString('es-AR') : '';
const enPesos   = n => '$' + Math.round(n || 0).toLocaleString('es-AR');
const capitalizar = t => t ? t[0].toUpperCase() + t.slice(1) : t;
const normalizarPatente = v => String(v || '').toUpperCase().replace(/[\s.-]/g, '');
/* La fecha del calendario, la del taller. NO toISOString(): eso da la fecha UTC,
   y en Argentina (UTC-3) todo lo cargado después de las 21hs saldría fechado al
   día siguiente. Los sellos creado_en/modificado_en sí van en UTC, que es lo
   correcto para un instante. */
const hoyISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
};

/* RF-022: no bloquea, sólo avisa. Misma regla que fn_es_formato_patente_valido en la base. */
const patenteFormatoValido = v => {
  const n = normalizarPatente(v);
  return /^[A-Z]{3}[0-9]{3}$/.test(n) || /^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(n);
};

/* ===================== número a letras ===================== */
const U = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const D = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const C = ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];

function centena(n){
  if(n === 0)   return '';
  if(n === 100) return 'cien';
  const c = Math.floor(n / 100), r = n % 100;
  let t = c ? C[c] : '';
  if(r){
    if(t) t += ' ';
    if(r < 30) t += U[r];
    else{
      t += D[Math.floor(r / 10)];
      if(r % 10) t += ' y ' + U[r % 10];
    }
  }
  return t;
}

function enLetras(n){
  n = Math.round(n);
  if(n === 0) return 'cero';
  if(n < 0)   return 'menos ' + enLetras(-n);
  const millones = Math.floor(n / 1e6);
  const miles    = Math.floor((n % 1e6) / 1000);
  const unidades = n % 1000;
  let t = '';
  if(millones) t += (millones === 1 ? 'un millón' : centena(millones) + ' millones');
  if(miles)    t += (t ? ' ' : '') + (miles === 1 ? 'mil' : centena(miles) + ' mil');
  if(unidades) t += (t ? ' ' : '') + centena(unidades);
  return t;
}

/* ===================== sesión =====================
   Login contra Supabase Auth. El token se guarda en este navegador para no pedir
   contraseña en cada visita, pero los datos (historial, numeración) no viven acá:
   viven en la base, así que cambiar de equipo o de navegador no pierde nada. */
const Sesion = {
  leer(){
    try{
      const s = JSON.parse(localStorage.getItem(CLAVE_SESION));
      return (s && s.access_token && s.refresh_token) ? s : null;
    }catch(e){ return null; }
  },
  grabar(s){ try{ localStorage.setItem(CLAVE_SESION, JSON.stringify(s)); }catch(e){} },
  borrar(){ try{ localStorage.removeItem(CLAVE_SESION); }catch(e){} }
};

let sesionActual = Sesion.leer();

async function pedirAuth(ruta, cuerpo){
  const r = await fetch(SUPABASE_URL + ruta, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo)
  });
  let datos = null;
  try{ datos = await r.json(); }catch(e){}
  return { ok: r.ok, status: r.status, datos };
}

async function iniciarSesion(email, password){
  const r = await pedirAuth('/auth/v1/token?grant_type=password', { email, password });
  if(!r.ok) return { error: (r.datos && (r.datos.error_description || r.datos.msg)) || 'No se pudo iniciar sesión' };
  const s = {
    access_token: r.datos.access_token,
    refresh_token: r.datos.refresh_token,
    expira_en: Date.now() + (r.datos.expires_in * 1000)
  };
  sesionActual = s;
  Sesion.grabar(s);
  return { ok: true };
}

/* Un solo refresco a la vez. Supabase rota el refresh token: si dos llamadas
   refrescan en paralelo —el CSV pide varios presupuestos juntos, o hay dos
   pestañas abiertas— la segunda usa un token ya gastado, falla, y cierra la
   sesión sin que haya pasado nada malo. Todas esperan el mismo refresco. */
let refrescoEnCurso = null;

async function refrescarSesion(){
  if(!sesionActual) return false;
  if(refrescoEnCurso) return refrescoEnCurso;
  refrescoEnCurso = (async () => {
    /* Otra pestaña pudo haber refrescado ya. El token bueno está en el
       almacenamiento, no en la memoria de esta pestaña: Supabase rota el refresh
       token y rechaza el anterior, así que hay que partir del guardado. */
    const guardada = Sesion.leer();
    if(guardada && guardada.refresh_token !== sesionActual.refresh_token){
      sesionActual = guardada;
      if(Date.now() < sesionActual.expira_en - 60000) return true;
    }
    const usado = sesionActual.refresh_token;
    const r = await pedirAuth('/auth/v1/token?grant_type=refresh_token', { refresh_token: usado });
    if(!r.ok){
      /* Puede haber fallado porque otra pestaña refrescó justo en el medio. Si en
         el almacenamiento quedó uno más nuevo, la sesión sigue viva. */
      const reciente = Sesion.leer();
      if(reciente && reciente.refresh_token !== usado){ sesionActual = reciente; return true; }
      cerrarSesion(); return false;
    }
    sesionActual = {
      access_token: r.datos.access_token,
      refresh_token: r.datos.refresh_token,
      expira_en: Date.now() + (r.datos.expires_in * 1000)
    };
    Sesion.grabar(sesionActual);
    return true;
  })();
  try{ return await refrescoEnCurso; }
  finally{ refrescoEnCurso = null; }
}

function cerrarSesion(){
  sesionActual = null;
  Sesion.borrar();
}

/* Une apikey + token a cada llamada, y renueva sola si está por vencer.
   Lanza si no hay forma de autenticar: quien llama decide qué avisar. */
async function api(ruta, opciones = {}){
  if(!sesionActual) throw new Error('sin-sesion');
  if(Date.now() > sesionActual.expira_en - 60000){
    if(!(await refrescarSesion())) throw new Error('sin-sesion');
  }
  const enviar = () => fetch(SUPABASE_URL + ruta, {
    ...opciones,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + sesionActual.access_token,
      'Content-Type': 'application/json',
      ...(opciones.headers || {})
    }
  });
  let r = await enviar();
  /* Un 401 puede ser sólo un token recién vencido: se refresca y se reintenta
     una vez. Recién si vuelve a dar 401 la sesión de verdad no sirve. Antes
     cualquier 401 suelto tiraba la sesión a la basura. */
  if(r.status === 401 && await refrescarSesion()) r = await enviar();
  if(r.status === 401){ cerrarSesion(); throw new Error('sin-sesion'); }
  return r;
}

async function leerJSON(r){
  try{ return await r.json(); }catch(e){ return null; }
}

async function pedirTrabajo(id_trabajo){
  const r = await api('/rest/v1/trabajos?id_trabajo=eq.' + id_trabajo +
    '&select=*,trabajo_items(orden,detalle,importe)');
  if(!r.ok) throw new Error('No se pudo abrir ese presupuesto');
  const filas = await leerJSON(r);
  return (filas && filas[0]) || null;
}

function trabajoAFormulario(t){
  const items = (t.trabajo_items || [])
    .slice()
    .sort((a, b) => a.orden - b.orden)
    .map(i => ({ detalle: i.detalle || '', importe: i.importe || 0 }));
  return {
    id_trabajo: t.id_trabajo, id_cliente: t.id_cliente, id_vehiculo: t.id_vehiculo,

    telefono: t.txt_telefono || '', vehiculo: t.txt_vehiculo || '', patente: t.txt_patente || '',
    monto_mano_obra: t.monto_mano_obra || 0, items, creado_en: t.creado_en
  };
}

/* Cuatro llamadas separadas, no una transacción — ver CONEXION-BASE.md, sección
   "Guardado". Si un paso falla después de que otro ya escribió, no hay rollback:
   un cliente o vehículo de más es inofensivo; un presupuesto sin renglones se
   recupera reabriéndolo. Cada error dice en qué paso se cortó. */
async function guardarEnBase(p){
  let id_cliente = p.id_cliente || null;
  if(id_cliente){
    const r = await api('/rest/v1/clientes?id_cliente=eq.' + id_cliente, {
      method: 'PATCH',
      body: JSON.stringify({ nombre: p.cliente, telefono: p.telefono || null, direccion: p.direccion || null })
    });
    if(!r.ok) throw new Error('No se pudo actualizar el cliente');
  }else{
    const r = await api('/rest/v1/clientes', {
      method: 'POST', headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ nombre: p.cliente, telefono: p.telefono || null, direccion: p.direccion || null })
    });
    if(!r.ok) throw new Error('No se pudo crear el cliente');
    const filas = await leerJSON(r);
    id_cliente = filas && filas[0] && filas[0].id_cliente;
  }

  let id_vehiculo = p.id_vehiculo || null;
  if(p.patente){
    const buscar = await api('/rest/v1/vehiculos?patente_norm=eq.' + encodeURIComponent(p.patente) + '&select=id_vehiculo');
    if(!buscar.ok) throw new Error('No se pudo revisar el vehículo');
    const encontrados = await leerJSON(buscar) || [];
    if(encontrados.length){
      id_vehiculo = encontrados[0].id_vehiculo;
    }else{
      const r = await api('/rest/v1/vehiculos', {
        method: 'POST', headers: { Prefer: 'return=representation' },
        body: JSON.stringify({ patente: p.patente, descripcion: p.vehiculo || null, id_cliente_ultimo: id_cliente })
      });
      if(!r.ok) throw new Error('No se pudo crear el vehículo');
      const filas = await leerJSON(r);
      id_vehiculo = filas && filas[0] && filas[0].id_vehiculo;
    }
  }else{
    id_vehiculo = null;
  }

  const datosTrabajo = {
    id_cliente, id_vehiculo, fecha_presupuesto: p.fecha || null,
    txt_cliente: p.cliente, txt_direccion: p.direccion || null, txt_telefono: p.telefono || null,
    txt_vehiculo: p.vehiculo || null, txt_patente: p.patente || null,
    monto_mano_obra: p.monto_mano_obra, modificado_en: new Date().toISOString()
  };

  let id_trabajo = p.id_trabajo || null;
  let numero = p.numero;
  if(id_trabajo){
    const r = await api('/rest/v1/trabajos?id_trabajo=eq.' + id_trabajo, {
      method: 'PATCH', body: JSON.stringify(datosTrabajo)
    });
    if(!r.ok) throw new Error('El presupuesto N° ' + numero + ' no se pudo actualizar');
  }else{
    /* El número se pide recién acá, no al abrir la herramienta: pedirlo lo gasta
       para siempre, y abrir la página diez veces no puede costar diez números.
       Pedirlo después del cliente y el vehículo también evita gastarlo si esos
       pasos fallan. */
    numero = await pedirProximoNumero();
    const r = await api('/rest/v1/trabajos', {
      method: 'POST', headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ ...datosTrabajo, numero_presupuesto: numero, origen_carga: 'presupuesto_web' })
    });
    if(!r.ok) throw new Error('El presupuesto N° ' + numero + ' no se pudo guardar');
    const filas = await leerJSON(r);
    id_trabajo = filas && filas[0] && filas[0].id_trabajo;
  }

  if(p.id_trabajo){
    const del = await api('/rest/v1/trabajo_items?id_trabajo=eq.' + id_trabajo, { method: 'DELETE' });
    if(!del.ok) throw new Error('El N° ' + numero + ' se guardó pero los renglones anteriores no se pudieron reemplazar');
  }
  if(p.items.length){
    const filas = p.items.map((it, i) => ({ id_trabajo, orden: i, detalle: it.detalle, importe: it.importe }));
    const r = await api('/rest/v1/trabajo_items', { method: 'POST', body: JSON.stringify(filas) });
    if(!r.ok) throw new Error('El N° ' + numero + ' se guardó pero los renglones no. Reabrilo del historial y guardá de nuevo');
  }

  return { id_trabajo, id_cliente, id_vehiculo, numero };
}

/* ===================== renglones ===================== */
const renglones = () => [...$('items').children];

function agregarRenglon(detalle = '', importe = ''){
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td><input class="det" autocomplete="off"></td>' +
    '<td class="imp"><input class="mon" inputmode="numeric" placeholder="0"></td>' +
    '<td class="x"><button class="quitar" aria-label="Quitar">×</button></td>';

  const det = tr.querySelector('.det');
  const mon = tr.querySelector('.mon');
  det.value = detalle;
  mon.value = conMiles(importe);

  det.oninput = () => { sucio = true; marcarVacias(); };
  mon.oninput = () => { sucio = true; calcular(); };
  mon.onblur  = () => { mon.value = conMiles(aNumero(mon.value)); calcular(); };
  tr.querySelector('.quitar').onclick = () => {
    tr.remove();
    if(!$('items').children.length) agregarRenglon();
    sucio = true;
    calcular();
  };

  $('items').appendChild(tr);
  return tr;
}

/* Los renglones vacíos no se imprimen. */
function marcarVacias(){
  renglones().forEach(tr => {
    const sinDetalle = !tr.querySelector('.det').value.trim();
    const sinImporte = !aNumero(tr.querySelector('.mon').value);
    tr.classList.toggle('vacia', sinDetalle && sinImporte);
  });
}

/* ===================== cálculo ===================== */
function calcular(){
  const repuestos = renglones().reduce((s, tr) => s + aNumero(tr.querySelector('.mon').value), 0);
  const total = repuestos + aNumero($('mo').value);
  $('total').textContent  = enPesos(total);
  $('letras').textContent = total ? capitalizar(enLetras(total)) : '—';
  marcarVacias();
}

function pintarFecha(){
  const v = $('fecha').value;
  $('fecha-txt').textContent = v ? v.split('-').reverse().join('/') : '';
}

/* ===================== formulario ===================== */
let idTrabajoActual = null;
let idClienteActual = null;
let idVehiculoActual = null;
let numeroActual = null;
let creadoEn = null;
let sucio = false;

function leerFormulario(){
  const items = renglones()
    .map(tr => ({
      detalle: tr.querySelector('.det').value.trim(),
      importe: aNumero(tr.querySelector('.mon').value)
    }))
    .filter(i => i.detalle || i.importe);

  const p = { numero: numeroActual, items, id_trabajo: idTrabajoActual,
              id_cliente: idClienteActual, id_vehiculo: idVehiculoActual };
  CAMPOS.forEach(c => p[c] = $(c).value.trim());
  p.patente            = normalizarPatente(p.patente);
  p.subtotal_repuestos = items.reduce((s, i) => s + i.importe, 0);
  p.monto_mano_obra    = aNumero($('mo').value);
  p.monto_total        = p.subtotal_repuestos + p.monto_mano_obra;

  const ahora = new Date().toISOString();
  p.creado_en     = creadoEn || ahora;
  p.modificado_en = ahora;
  return p;
}

/* RF-024: la base lo permite, esta página lo exige antes de guardar. */
function camposFaltantes(p){
  const faltan = [];
  if(!p.fecha)                 faltan.push('la fecha');
  if(!p.cliente)                faltan.push('el nombre del cliente');
  if(!p.direccion)              faltan.push('la dirección');
  if(!p.telefono)               faltan.push('el teléfono');
  if(!(p.monto_mano_obra > 0))  faltan.push('la mano de obra');
  return faltan;
}

/* La marca de agua lleva el número, así que se repinta cada vez que cambia. */
function pintarMarca(){
  const nro = numeroActual != null ? ('N° ' + numeroActual) : 'SIN EMITIR';
  const linea = 'TALLER EL SEMÁFORO · ' + nro + ' · CUIT 30-71219060-0 · ';
  $('marca').firstElementChild.textContent = linea.repeat(28);
}

function mostrar(p){
  numeroActual   = p.numero;
  idTrabajoActual  = p.id_trabajo || null;
  idClienteActual  = p.id_cliente || null;
  idVehiculoActual = p.id_vehiculo || null;
  creadoEn = p.creado_en || null;
  $('nro').textContent = p.numero != null ? p.numero : '—';
  $('nro-aviso').hidden = (p.numero != null);
  CAMPOS.forEach(c => $(c).value = p[c] || '');
  pintarFecha();
  $('mo').value = conMiles(p.monto_mano_obra);
  $('items').innerHTML = '';
  const items = (p.items && p.items.length) ? p.items : [{}, {}, {}];
  items.forEach(i => agregarRenglon(i.detalle || '', i.importe || ''));
  calcular();
  pintarMarca();
  sucio = false;
}

/* Un presupuesto en blanco no tiene número todavía: se pide al guardar. Abrir la
   herramienta o empezar uno nuevo no gasta ninguno (ver CONEXION-BASE.md). */
function irANuevo(){
  mostrar({ numero: null, fecha: hoyISO(), items: [] });
}

/* Evita perder lo tipeado al hacer "Nuevo" o abrir otro del historial. */
function confirmarDescarte(){
  return !sucio || confirm('Tenés cambios sin guardar. ¿Los descartás?');
}

/* ===================== acciones ===================== */
function avisar(texto){
  const a = $('aviso');
  a.textContent = texto;
  a.classList.add('ver');
  clearTimeout(a._t);
  a._t = setTimeout(() => a.classList.remove('ver'), 3200);
}

const cerrarMenu = () => $('acciones').classList.remove('abierto');

async function guardarYPdf(){
  cerrarMenu();
  const p = leerFormulario();
  if(!p.cliente && !p.items.length) return avisar('Cargá al menos el cliente o un renglón');

  const faltan = camposFaltantes(p);
  if(faltan.length) return avisar('Falta cargar: ' + faltan.join(', '));
  /* La base rechaza importes negativos, y para cuando los rechaza el número ya
     está gastado. Se atajan acá. */
  if(p.items.some(i => i.importe < 0)) return avisar('Hay un renglón con importe negativo');

  const boton = $('b-pdf');
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  try{
    const resultado = await guardarEnBase(p);
    idTrabajoActual  = resultado.id_trabajo;
    idClienteActual  = resultado.id_cliente;
    idVehiculoActual = resultado.id_vehiculo;
    numeroActual     = resultado.numero;
    $('nro').textContent = numeroActual;   // tiene que estar en pantalla antes de imprimir
    $('nro-aviso').hidden = true;
    pintarMarca();
    sucio = false;
    avisar('Guardado con el N° ' + numeroActual + '. Elegí "Guardar como PDF"');
    if(document.activeElement) document.activeElement.blur();
    setTimeout(() => window.print(), 420);
  }catch(e){
    if(e.message === 'sin-sesion'){ mostrarLogin('La sesión venció. Iniciá sesión de nuevo'); return; }
    avisar(e.message || 'No se pudo guardar');
  }finally{
    boton.disabled = false;
    boton.textContent = 'Guardar y hacer PDF';
  }
}

/* ===================== archivos (CSV de respaldo) =====================
   Sólo exportación: es una copia para contabilidad/planilla, ya no el respaldo
   del que depende recuperar nada — eso lo garantiza la base. */
function bajarArchivo(texto, tipo, nombre){
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

const entrecomillar = s => /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
const celdaNumero   = v => entrecomillar(String(v ?? ''));
const celdaTexto    = v => {
  const s = String(v ?? '');
  return entrecomillar(/^[=+\-@]/.test(s) ? "'" + s : s);
};
const filaCSV = valores => valores.map((v, i) => TEXTO[i] ? celdaTexto(v) : celdaNumero(v)).join(';');

function filasDe(p){
  const izq = [p.numero_presupuesto, p.fecha_presupuesto, p.cliente_actual || p.txt_cliente, p.txt_direccion,
               p.txt_telefono, p.txt_vehiculo, p.patente_norm || p.txt_patente];
  const der = [p.subtotal_conceptos, p.monto_mano_obra, p.monto_total, p.creado_en, p.modificado_en];
  const items = (p.items || []).map(i => [...izq, i.detalle, i.importe, ...der]);
  if(p.monto_mano_obra) items.push([...izq, 'Mano de obra', p.monto_mano_obra, ...der]);
  if(!items.length)     items.push([...izq, '', '', ...der]);
  return items;
}

async function descargarCSV(){
  cerrarMenu();
  avisar('Preparando CSV…');
  try{
    const historial = await pedirHistorial();
    if(!historial.length) return avisar('Todavía no hay presupuestos guardados');
    /* El CSV lleva los renglones de cada presupuesto: una segunda consulta por cada uno. */
    const completos = await Promise.all(historial.map(h => pedirTrabajo(h.id_trabajo)));
    const filas = [COLUMNAS.join(';')];
    completos.forEach((t, i) => {
      if(!t) return;
      const items = (t.trabajo_items || []).slice().sort((a, b) => a.orden - b.orden);
      filasDe({ ...historial[i], txt_direccion: t.txt_direccion, txt_telefono: t.txt_telefono,
                creado_en: t.creado_en, modificado_en: t.modificado_en, items }).forEach(f => filas.push(filaCSV(f)));
    });
    bajarArchivo('﻿' + filas.join('\n'), 'text/csv;charset=utf-8',
                 'presupuestos_el_semaforo_' + hoyISO() + '.csv');
    avisar('CSV descargado');
  }catch(e){
    if(e.message === 'sin-sesion'){ mostrarLogin('La sesión venció. Iniciá sesión de nuevo'); return; }
    avisar(e.message || 'No se pudo generar el CSV');
  }
}

/* ===================== historial ===================== */
function filaHistorial(h){
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML =
    '<div class="i-datos"><div class="i-n"></div><div class="i-d"></div></div><div class="i-m"></div>';

  div.querySelector('.i-n').textContent = 'N° ' + h.numero_presupuesto + ' — ' + (h.cliente_actual || h.txt_cliente || 'sin nombre');
  div.querySelector('.i-d').textContent = [h.txt_vehiculo, h.patente_norm, h.fecha_presupuesto].filter(Boolean).join(' · ');
  div.querySelector('.i-m').textContent = enPesos(h.monto_total);

  div.onclick = async () => {
    if(!confirmarDescarte()) return;
    try{
      const t = await pedirTrabajo(h.id_trabajo);
      if(!t) return avisar('Ese presupuesto ya no está disponible');
      mostrar(trabajoAFormulario(t));
      $('modal').classList.remove('abierto');
      window.scrollTo(0, 0);
    }catch(e){
      if(e.message === 'sin-sesion'){ mostrarLogin('La sesión venció. Iniciá sesión de nuevo'); return; }
      avisar(e.message || 'No se pudo abrir ese presupuesto');
    }
  };
  return div;
}

async function abrirHistorial(){
  cerrarMenu();
  const lista = $('lista');
  lista.innerHTML = '<div class="vacio">Cargando…</div>';
  $('modal').classList.add('abierto');
  try{
    const historial = await pedirHistorial();
    lista.innerHTML = '';
    if(!historial.length){
      lista.innerHTML = '<div class="vacio">Todavía no hay presupuestos guardados.</div>';
    }else{
      historial.forEach(h => lista.appendChild(filaHistorial(h)));
    }
  }catch(e){
    if(e.message === 'sin-sesion'){ $('modal').classList.remove('abierto'); mostrarLogin('La sesión venció. Iniciá sesión de nuevo'); return; }
    lista.innerHTML = '<div class="vacio">No se pudo leer el historial.</div>';
  }
}

/* ===================== login ===================== */
function mostrarLogin(mensaje){
  $('carga').classList.remove('abierto');
  $('app').hidden = true;
  $('login-error').hidden = !mensaje;
  $('login-error').textContent = mensaje || '';
  $('login').classList.add('abierto');
  $('login-pass').value = '';
  setTimeout(() => $('login-email').focus(), 50);
}

async function intentarLogin(){
  const email = $('login-email').value.trim();
  const pass  = $('login-pass').value;
  if(!email || !pass){
    $('login-error').textContent = 'Completá email y contraseña.';
    $('login-error').hidden = false;
    return;
  }
  const boton = $('login-entrar');
  boton.disabled = true;
  boton.textContent = 'Ingresando…';
  $('login-error').hidden = true;
  const r = await iniciarSesion(email, pass);
  boton.disabled = false;
  boton.textContent = 'Ingresar';
  if(r.error){
    $('login-error').textContent = r.error;
    $('login-error').hidden = false;
    return;
  }
  $('login').classList.remove('abierto');
  await entrarALaApp();
}

/* ===================== conexiones ===================== */
$('b-menu').onclick  = () => $('acciones').classList.toggle('abierto');
$('b-pdf').onclick   = guardarYPdf;
$('b-csv').onclick   = descargarCSV;
$('b-hist').onclick  = abrirHistorial;
$('b-nuevo').onclick = () => {
  cerrarMenu();
  if(!confirmarDescarte()) return;
  irANuevo();
  window.scrollTo(0, 0);
  avisar('Presupuesto en blanco. El número se asigna al guardar');
};
$('b-salir').onclick = () => {
  cerrarMenu();
  if(!confirm('¿Cerrar sesión?')) return;
  cerrarSesion();
  mostrarLogin();
};
$('b-cerrar').onclick = () => $('modal').classList.remove('abierto');
$('modal').onclick    = e => { if(e.target === $('modal')) $('modal').classList.remove('abierto'); };
$('add').onclick      = () => { sucio = true; agregarRenglon().querySelector('.det').focus(); };
$('mo').oninput       = () => { sucio = true; calcular(); };
$('mo').onblur        = () => { $('mo').value = conMiles(aNumero($('mo').value)); calcular(); };
$('fecha').onchange   = () => { sucio = true; pintarFecha(); };
$('patente').onblur   = e => {
  e.target.value = normalizarPatente(e.target.value);
  if(e.target.value && !patenteFormatoValido(e.target.value)) avisar('Formato de patente inusual — revisala');
};
CAMPOS.filter(c => c !== 'fecha').forEach(c => $(c).oninput = () => { sucio = true; });

$('login-entrar').onclick = intentarLogin;
$('login-pass').onkeydown = e => { if(e.key === 'Enter') intentarLogin(); };
$('login-email').onkeydown = e => { if(e.key === 'Enter') $('login-pass').focus(); };

document.addEventListener('click', e => {
  if(!$('acciones').contains(e.target)) cerrarMenu();
});
window.addEventListener('beforeunload', e => {
  if(sucio){ e.preventDefault(); e.returnValue = ''; }
});

/* ===================== arranque ===================== */
async function entrarALaApp(){
  $('carga-txt').textContent = 'Conectando…';
  $('carga').classList.add('abierto');
  $('app').hidden = true;
  try{
    /* Confirma que la sesión sirve de verdad, sin gastar ningún número. */
    const r = await api('/rest/v1/vw_presupuestos?select=id_trabajo&limit=1');
    if(!r.ok) throw new Error('No se pudo conectar con la base');
    /* Si la sesión venció en medio de una carga, al volver a entrar hay que
       encontrar el presupuesto como estaba: en blanco sólo si no había nada. */
    if(!sucio) irANuevo();
    $('carga').classList.remove('abierto');
    $('app').hidden = false;
    window.scrollTo(0, 0);
  }catch(e){
    if(e.message === 'sin-sesion'){ mostrarLogin('La sesión venció. Iniciá sesión de nuevo'); return; }
    $('carga-txt').textContent = 'No se pudo conectar con la base. Revisá tu conexión y recargá la página.';
  }
}

(async function(){
  if(sesionActual){
    await entrarALaApp();
  }else{
    mostrarLogin();
  }
})();
</script>
